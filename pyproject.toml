[project]
name = "athlete-first"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
   "alembic>=1.20.0,<1.21",
   "asyncpg>=0.31.0,<0.32",
   "bcrypt>=5.0.0",
   "fastapi[standard]>=0.141.1,<0.142",
   "httpx>=0.28.1,<0.29",
   "pandas>=3.0.5,<3.1",
   "pydantic>=2.13.5,<2.14",
   "pydantic-settings>=2.15.0,<2.16",
   "pyjwt>=2.14.0,<2.15",
   "sqlalchemy>=2.0.53,<2.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1,<26.6",
    "faker>=40.39.0,<40.40",
    "pytest>=9.1.1,<9.2",
    "pytest-asyncio>=1.4.0,<1.5",
    "pytest-cov>=7.1.0,<7.2",
    "ruff>=0.16.7,<0.17",
]
server = [
    "psycopg[c,pool]>=3.3.5,<3.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "ARG001", # unused arguments in functions
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]
ignore = [
    "ARG001", # Unused function argument, caller of function may require certain kwargs present, but not all kwargs may be used
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e, for HTTPException
    "E501",  # line too long, handled by black
    "UP045", # Use `X | None` for type annotations
    "UP017", # Use `datetime.UTC` alias (not recognized in current version of python)
    "UP043", # Unnecessary default type arguments, ignore
    "UP007", # Allow usage of Union type
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.pyupgrade]
# Preserve types if a file imports `from __future__ import annotations`
keep-runtime-typing = true

[tool.coverage.run]
source = ['.']
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __str__",
]
fail_under = 80
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py",  "*/config.py"]
sort = "Cover"


