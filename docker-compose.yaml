services:
  athlete-first:
    container_name: athlete-first
    restart: unless-stopped
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/scripts
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    env_file:
      - .env
    environment:
      - PORT=8000
      - AF_env=dev
      - DB_host=postgres
      - DB_user=${DB_user:-devuser}
      - DB_password=${DB_password:-devpass}
      - DB_name=${DB_name:-devdatabase}
    depends_on:
      - postgres

  pgadmin:
    # Config adapted from: https://stackoverflow.com/a/77519799/10914922
    image: dpage/pgadmin4
    restart: unless-stopped
    attach: false
    ports:
      - "8888:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=changeme
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    user: root
    depends_on:
      - postgres
    entrypoint: /bin/sh -c "chmod 600 /pgpass; /entrypoint.sh;"
    volumes:
      - pgadmin-af-dev:/var/lib/pgadmin
      - ./_pg_scripts:/root/scripts
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
      - source: pgpass
        target: /pgpass

  postgres:
    image: postgres:17-alpine
    attach: false
    restart: unless-stopped
    environment:
      - POSTGRES_MULTIPLE_DATABASES=${DB_name:-devdatabase},test
      - POSTGRES_USER=${DB_user:-devuser}
      - POSTGRES_PASSWORD=${DB_password:-devpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh

volumes:
  postgres_data:
  pgadmin-af-dev:

configs:
  pgpass:
    content: postgres:5432:*:${DB_user:-devuser}:${DB_password:-devpass}
  servers.json:
    content: |
      {
        "Servers": {
            "1": {
                "Group": "Servers",
                "Name": "Docker",
                "Host": "postgres",
                "Port": 5432,
                "MaintenanceDB": "${DB_name:-devdatabase}",
                "Username": "${DB_user:-devuser}",
                "PassFile": "/pgpass",
                "SSLMode": "prefer",
                "Favorite": true
            }
        }
      }
